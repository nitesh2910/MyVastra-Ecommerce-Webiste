services:
  - type: web
    name: myvastra
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py collectstatic --noinput
    startCommand: gunicorn myvastra.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: myvastra-ecommerce-webiste.onrender.com
      - key: DJANGO_SETTINGS_MODULE
        value: myvastra.settings
      - fromDatabase:
          name: myvastradb
          property: connectionString
        key: DATABASE_URL
